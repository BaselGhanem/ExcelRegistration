function recommend(){const{work,goal,level}=S.ans;if(!work||!goal||!level)return null;let e=0,p=0;if(work===`excel`)e+=3;if(work===`mixed`)p+=3;if(work===`new`)e++;if(goal===`automation`)e+=3;if(goal===`dashboard`)p+=4;if(goal===`analysis`){e++;p++}if(level===`beginner`)e++;if(level===`advanced`)p++;const key=p>e?`powerbi`:`excel`;return{key,reason:key===`excel`?`لأن هدفك أقرب للشغل اليومي داخل الجداول وتسريع التحليل والمهام المتكررة.`:`لأن هدفك أقرب لربط المصادر وبناء Dashboards تفاعلية ونموذج بيانات مترابط.`}}
function render(){if(S.courses[S.course]?.visible===false)S.course=Object.keys(S.courses).find(k=>S.courses[k].visible!==false)||S.course;const st=steps[S.step],x=c();root.innerHTML=`<div class="app">${S.loading?`<div class="loader"><div><img src="./assets/cello-flow/guide.webp" alt=""><span>Cello يجهّز رحلتك</span></div></div>`:``}<header class="top">${brand()}${progress()}</header><main class="journey"><section class="visual"><div class="grid"></div><img class="cello" src="./assets/cello-flow/${st[2]}" alt="Cello"><div class="caption"><span>CELLO SAYS</span><p>${st[3]}</p></div></section><section class="content"><div class="mobile-brand">${brand()}</div><div class="shell"><div class="meta"><span>المرحلة ${S.step+1} من 8</span><span>${st[0]}</span></div><h1>${st[1]}</h1><p class="subtitle">${S.step===0?`Excel أم Power BI؟ اختر بناءً على هدفك، وإذا لم تكن متأكداً سنساعدك.`:x.name}</p><div class="stage">${views[S.step]()}</div></div>${nav()}</section></main><div class="fab"><a href="${WA}" target="_blank" data-track="whatsapp_click">☎ <span>دعم واتساب</span></a></div>${S.helper?helper():``}</div>`;bind();setCookie(`xa_last_course`,S.course);setCookie(`xa_last_step`,String(S.step))}
function bind(){document.querySelectorAll(`[data-course]`).forEach(b=>b.onclick=()=>{S.course=b.dataset.course;track(`course_selected`,{course:S.course});render()});document.querySelectorAll(`[data-step]`).forEach(b=>b.onclick=()=>go(Number(b.dataset.step)));document.querySelectorAll(`[data-a=next]`).forEach(b=>b.onclick=next);document.querySelectorAll(`[data-a=back]`).forEach(b=>b.onclick=back);document.querySelectorAll(`[data-a=secret]`).forEach(b=>b.onclick=secret);document.querySelectorAll(`[data-a=resume]`).forEach(b=>b.onclick=()=>{S.max=Math.max(S.max,S.resume);go(S.resume)});document.querySelectorAll(`[data-a=helper]`).forEach(b=>b.onclick=()=>{S.helper=true;render()});document.querySelectorAll(`[data-a=close]`).forEach(b=>b.onclick=()=>{S.helper=false;render()});document.querySelectorAll(`[data-g]`).forEach(b=>b.onclick=()=>{S.ans[b.dataset.g]=b.dataset.v;render()});document.querySelectorAll(`[data-rec]`).forEach(b=>b.onclick=()=>{S.course=b.dataset.rec;S.helper=false;track(`course_helper_selected`,{course:S.course});render()});document.querySelectorAll(`.why`).forEach(b=>b.onclick=()=>b.closest(`article`).classList.toggle(`open`));document.querySelectorAll(`[data-track]`).forEach(a=>a.onclick=()=>track(a.dataset.track,{course:S.course,step:S.step}));document.getElementById(`reg`)?.addEventListener(`submit`,submit)}function go(i){if(i<0||i>S.max||i>7)return;S.step=i;track(`step_view`,{course:S.course,step:i,stepName:steps[i][0]});render()}function next(){if(S.step>=7)return;S.step++;S.max=Math.max(S.max,S.step);track(`step_view`,{course:S.course,step:S.step,stepName:steps[S.step][0]});render()}function back(){if(S.step<=0)return;S.step--;render()}function secret(){clearTimeout(S.timer);S.clicks++;if(S.clicks>=5){location.href=`./admin.html`;return}S.timer=setTimeout(()=>S.clicks=0,2500)}async function submit(e){e.preventDefault();const f=new FormData(e.currentTarget),d={name:String(f.get(`name`)||``).trim(),email:String(f.get(`email`)||``).trim(),phone:String(f.get(`phone`)||``).trim(),city:String(f.get(`city`)||``).trim()};if(d.name.length<3||!d.email.includes(`@`)||d.phone.length<7)return;S.status=`saving`;render();try{await post(`registrations`,{...d,course:S.course,totalScore:0,createdAt:new Date().toISOString(),source:`cello-typeform-2026`,visitorId:vid,sessionId:sid,utmSource:qs.get(`utm_source`)||cookie(`xa_utm_source`)||``,utmMedium:qs.get(`utm_medium`)||cookie(`xa_utm_medium`)||``,utmCampaign:qs.get(`utm_campaign`)||cookie(`xa_utm_campaign`)||``});track(`registration_completed`,{course:S.course});S.status=`done`}catch{S.status=`error`}render()}
addEventListener(`keydown`,e=>{if(S.helper&&e.key===`Escape`){S.helper=false;render();return}if([`INPUT`,`TEXTAREA`,`SELECT`].includes(document.activeElement?.tagName))return;if(e.key===`ArrowLeft`&&S.step<7)next();if(e.key===`ArrowRight`&&S.step>0)back()});async function init(){render();await Promise.race([settings(),new Promise(r=>setTimeout(r,850))]);S.loading=false;render();visit();track(`step_view`,{course:S.course,step:0,stepName:steps[0][0]});setInterval(()=>{if(!document.hidden&&S.step!==7&&!S.helper)settings().then(render)},60000)}init();
</script></body></html>
